spring:
  application:
    name: hugo-board-api
  datasource:
    url: jdbc:sqlite:${HUGO_DB_PATH:data/board.db}?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

springdoc:
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

spring:
  application:
    name: hugo-board-api
  datasource:
    url: jdbc:sqlite:${HUGO_DB_PATH:data/board.db}?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

hugo:
  admin:
    email: ${HUGO_ADMIN_EMAIL:}
    password: ${HUGO_ADMIN_PASSWORD:}
  jira:
    base-url: ${HUGO_JIRA_BASE_URL:}
    email: ${HUGO_JIRA_EMAIL:}
    api-token: ${HUGO_JIRA_API_TOKEN:}
    board-id: ${HUGO_JIRA_BOARD_ID:}

# No springdoc.* section: writer-with-order-by-keys / writer-with-default-pretty-printer
# had no effect on contracts/openapi.json in this Spring Boot / springdoc version, so they
# were dropped rather than kept as dead config. The JSON content type for every endpoint
# is set explicitly via @RequestMapping(produces = ...) on each controller instead.

spring:
  datasource:
    url: jdbc:sqlite:target/test-${random.uuid}.db?foreign_keys=true&journal_mode=WAL&busy_timeout=5000
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

hugo:
  admin:
    email: admin@test.local
    password: test-admin-password
  dashboard:
    # Large enough that the real @Scheduled poll never fires again during a test's short
    # lifetime; tests call DashboardSyncService.syncNow() directly instead of waiting for it.
    poll-interval-ms: 999999999

<div class="corner">
  <theme-toggle />
</div>

<header class="intro">
  <h1>HUGO Feature Request Board</h1>
  <p class="muted">Lépj be a kollégáid értékeléséhez vagy az űrlapok kezeléséhez.</p>
</header>

<div class="login-options">
  <p-card class="login-card stagger-item">
    <form class="login-form member-login" [formRoot]="memberForm" (submit)="onMemberLogin()">
      <h2><i class="pi pi-user" aria-hidden="true"></i> Kolléga belépés</h2>
      <label for="member-select">Ki vagy?</label>
      <p-select
        inputId="member-select"
        [formField]="memberForm.memberId"
        placeholder="Válaszd ki magad"
        optionLabel="name"
        optionValue="id"
        [options]="members()"
        [fluid]="true"
        [class.p-invalid]="false"
      />
      @if (memberError(); as message) {
        <p-message severity="error" class="error">{{ message }}</p-message>
      }
      <p-button
        type="submit"
        label="Belépés"
        icon="pi pi-sign-in"
        [fluid]="true"
        [loading]="memberLoading()"
      />
    </form>
  </p-card>

  <p-card class="login-card stagger-item">
    <form class="login-form admin-login" [formRoot]="adminForm" (submit)="onAdminLogin()">
      <h2><i class="pi pi-shield" aria-hidden="true"></i> Admin belépés</h2>
      <label for="admin-email">E-mail cím</label>
      <input pInputText id="admin-email" type="email" [formField]="adminForm.email" autocomplete="username" [fluid]="true" [class.p-invalid]="false" />
      <label for="admin-password">Jelszó</label>
      <input
        pInputText
        id="admin-password"
        type="password"
        [formField]="adminForm.password"
        autocomplete="current-password"
        [fluid]="true"
        [class.p-invalid]="false"
      />
      @if (adminError(); as message) {
        <p-message severity="error" class="error">{{ message }}</p-message>
      }
      <p-button
        type="submit"
        label="Belépés adminként"
        icon="pi pi-sign-in"
        severity="secondary"
        [fluid]="true"
        [loading]="adminLoading()"
      />
    </form>
  </p-card>
</div>

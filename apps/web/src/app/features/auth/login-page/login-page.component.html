<h1>HUGO Feature Request Board</h1>
<div class="login-options">
  <form class="login-card" [formGroup]="adminForm" (ngSubmit)="onAdminLogin()">
    <h2>Admin belépés</h2>
    <label for="admin-email">E-mail cím</label>
    <input id="admin-email" type="email" formControlName="email" autocomplete="username" />
    <label for="admin-password">Jelszó</label>
    <input
      id="admin-password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
    />
    @if (adminError()) {
      <p class="error" role="alert">{{ adminError() }}</p>
    }
    <button type="submit">Belépés adminként</button>
  </form>

  <form class="login-card" [formGroup]="memberForm" (ngSubmit)="onMemberLogin()">
    <h2>Kolléga belépés</h2>
    <label for="member-select">Ki vagy?</label>
    <select id="member-select" formControlName="memberId">
      <option [ngValue]="null" disabled>Válaszd ki magad</option>
      @for (member of members(); track member.id) {
        <option [ngValue]="member.id">{{ member.name }}</option>
      }
    </select>
    @if (memberError()) {
      <p class="error" role="alert">{{ memberError() }}</p>
    }
    <button type="submit">Belépés</button>
  </form>
</div>
